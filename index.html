/* Screenshot-inspired landing page */
:root{--bg:#0a1012;--card:#121a1d;--line:#273035;--lime:#d1ff4c}
body{background:var(--bg)}
header{background:rgba(8,13,15,.96);backdrop-filter:blur(16px)}
.bar{max-width:1480px;min-height:70px;padding:10px 30px;gap:25px}
.logo{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:850;letter-spacing:-.055em}
.logo b{color:var(--lime)}

nav a.on{background:transparent;color:var(--lime);box-shadow:inset 0 -2px var(--lime)}
.who{border-color:#4a575c;color:#fff;background:transparent;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
main{max-width:none;padding:0 0 80px}

.landing-hero-inner{position:relative;z-index:1;width:100%;max-width:1480px;padding:30px 58px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:30px}

function knockoutBracket(event, firstRoundTeams=null) {
  const maximum = Math.max(2, Number(String(event.teams).split("/")[1]) || 16);
  // When group qualification is known, bracket is based on qualifiers.
  // Otherwise use the configured event capacity (demo projection).
  const entrants = firstRoundTeams && firstRoundTeams.length
    ? firstRoundTeams.length
    : Math.min(128, maximum);
  const size = 2 ** Math.ceil(Math.log2(Math.max(2,entrants)));
  const rounds = Math.log2(size), cardH=82, step=106, colW=254, gap=76, top=66;
  const fullHeight = Math.max(350, size/2*step + 80);
  const fullWidth = rounds * (colW+gap)-gap + 12;
  const rows = [], links=[];
  let positions = Array.from({length:size/2}, (_,i)=>top+i*step+cardH/2);
  const roundTitles = n=>n===2?"Finale":n===4?"Halbfinale":n===8?"Viertelfinale":n===16?"Achtelfinale":n===32?"Sechzehntelfinale":n===64?"Zweiunddreißigstelfinale":"KO-Runde";
  for (let r=0; r<rounds; r++){
    const count=size / 2**(r+1), left=r*(colW+gap);
    rows.push(`<div class="kn-round-title" style="left:${left}px">${roundTitles(size/2**r)} <span>${String(r+1).padStart(2,"0")}</span></div>`);
    for(let i=0;i<count;i++){
      const center=positions[i], topY=center-cardH/2;
      let a,b;
      if (r===0 && firstRoundTeams) {

function rankingStatsForYear(year){
 const s=stats();
 if(year==="Alle Jahre")return s;
 const n=Number(year);
 const historic=PAST.filter(e=>e.d.endsWith(String(n)));
 const matches=n===2026?M.filter(m=>m.state==="done"):[];
 return T.map(t=>{
  const x={id:t.id,w:0,l:0,cp:0,cm:0,diff:0,titles:0,pod:0,bonus:0,mp:0,total:0};
  matches.forEach(m=>{
   if(m.a!==t.id&&m.b!==t.id)return;
   const f=m.a===t.id?m.sa:m.sb,c=m.a===t.id?m.sb:m.sa;
   x.cp+=f;x.cm+=c;if(f>c)x.w++;else x.l++;
  });
  historic.forEach(e=>e.pod.forEach((id,i)=>{
   if(id!==t.id)return;
   x.pod++;x.bonus+=[20,15,10][i];if(i===0)x.titles++;
  }));
  x.diff=x.cp-x.cm;x.mp=3*x.w;x.total=x.mp+x.bonus;
  return x;
 });
}

function rulesMarkup(){return `<div class="rulehero rulehero-v47 bpa-page-heading"><div class="kicker">Turnierregeln · Entwurf</div><h2>REGELN<span style="color:var(--lime)">.</span></h2><p class="bpa-page-sub">Vom ersten Wurf bis zur letzten Verlängerung – alle wichtigen Spiel- und Turnierregeln im Überblick.</p><div class="rulefacts"><span>2 vs. 2</span><span>10 Becher</span><span>3 Punkte pro Sieg</span><span>4er-Gruppen</span></div></div><div class="rules rules-v47"><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">01</span> Grundprinzip und Spielmaterial</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>2 gegen 2. Je Team stehen zehn Becher als Dreieck.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Zwei gleichartige Bälle; gleiche Bedingungen an beiden Tischseiten.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Beide Teams prüfen vor dem ersten Wurf Becher und Spielfeld.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Alkoholfreie Getränke sind möglich. Für das Ergebnis zählt allein der gültige Treffer.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">02</span> Spielbeginn und Seitenwahl</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Gruppenphase: Anwurf und bei Uneinigkeit Tischseite per Los.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>KO-Phase: Optionales Wahlrecht für das besser platzierte Team.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">03</span> Wurfreihenfolge und Ablauf einer Runde</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Beide Teammitglieder werfen nacheinander je einmal.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Getroffene Becher werden nach Abschluss des Durchgangs entfernt.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Nach Unterbrechungen wird die Reihenfolge vorab geklärt.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Getroffene Becher werden nach Abschluss des Durchgangs entfernt.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">04</span> Was als gültiger Treffer zählt</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Der Ball muss im Becher landen; ein Randkontakt allein zählt nicht.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Becher werden nach dem Durchgang entfernt; selbst umgeworfene Becher können verloren sein.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Bei unklaren Szenen entscheidet die Turnierleitung vor dem nächsten Wurf.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">05</span> Doppeltreffer, gleicher Becher und Sonderwürfe</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Treffen beide Spieler regulär, gibt es genau einen Zusatzwurf.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Zwei Treffer im selben aktiven Becher zählen als drei entfernte Becher, soweit vorhanden.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Erst beide Würfe ausführen, dann Becher zählen und Bonuswurf spielen.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Sonderwürfe gelten nur, wenn sie vorab ausdrücklich zugelassen wurden.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">06</span> Aufsetzer, Trickwürfe und Ballkontakt</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Ein Aufsetzer kann zwei Becher kosten; den zweiten bestimmt die Abwehr.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Abwehr erst nach erlaubtem Kontakt außerhalb des Bechers; kein Eingriff im Becher.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Fächern, Pusten und absichtliche Luftlenkung sind verboten.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Unklare Sonderwürfe entscheidet die Turnierleitung nach den Turnierregeln.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">07</span> Wurfposition, Verteidigung und Fair Play</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Beim Wurf hinter dem eigenen Tischende bleiben; keine separate Ellbogenlinie.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Verteidigung nur nach zulässigem Kontakt und ohne Eingriff über die Tischhälfte.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">08</span> Becher umstellen und ausrichten</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Maximal zwei gewünschte Umstellungen der eigenen Becher pro Spiel.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Nur vor dem gegnerischen Durchgang, kompakt und regelkonform.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Leicht verrutschte Becher dürfen zusätzlich zusammengeschoben werden.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Das Umstellen darf den Spielfluss nicht unnötig verzögern.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">09</span> Spielende und letzte Chance</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Nach dem letzten Becher gibt es grundsätzlich noch eine Aufholmöglichkeit.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Trifft das zurückliegende Team alle verbleibenden Becher, geht es in die Verlängerung.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Die Zahl der erlaubten Versuche wird vorher geklärt; Ausnahmen nur bei angekündigter Sofort-Ende-Regel.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Die letzte Chance und das genaue Spielende sind für alle Teams gleich geregelt.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">10</span> Verlängerung</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>In der Verlängerung startet jedes Team mit drei Bechern als Pyramide.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Die Becher bleiben in ihrer Formation; normale Treffer- und Wurfregeln gelten.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">11</span> Spieldauer, Spielplan und Tische</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Rechtzeitig am zugewiesenen Tisch sein; Anweisungen der Turnierleitung gehen vor.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Nach 30 Minuten darf die Leitung abbrechen und nach Bechervorsprung werten.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Bei Gleichstand entscheidet der nächste gültige Treffer; absichtliche Verzögerung kann bestraft werden.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Die Turnierleitung kann feste Spielzeiten und Tischzuweisungen vorgeben.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">12</span> Ergebnis, Punkte und Cupdifferenz</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Beide Teams melden das Ergebnis; nur die Turnierleitung trägt es ein.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Sieg: 3 Punkte, Niederlage: 0. Danach zählen Cupdifferenz und erzielte Cups.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Technische 2:0-Siege zählen als Turnierwertung; bei Gleichstand folgen festgelegte Tie-Breaker.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Unstimmigkeiten müssen vor Bestätigung des Ergebnisses gemeldet werden.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">13</span> Gruppenauslosung und Freilose</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Zufällige Vierergruppen; jedes echte Team spielt gegen jedes andere der Gruppe.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Fehlende Teams werden als Freilos geführt; technisch 2:0 für das echte Team.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">14</span> Anwesenheit, Spielerausfall und Teamwechsel</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Pro Spiel treten die zwei für das Turnier gemeldeten Spieler an.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Nach angemessener Wartefrist kann bei Nichtantritt 2:0 gewertet werden.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Mehrere Teams pro Account sind erlaubt, aber kein spontaner Teamwechsel im Turnier.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Teamwechsel richten sich nach den vorab festgelegten Turnierbedingungen.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">15</span> Zuschauer, Beschwerden und Entscheidung</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Anfeuern ist erlaubt; Spieler, Sicht und Spielfeld dürfen nicht gestört werden.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Bei Streit: Spiel stoppen, beide Seiten anhören, Entscheidung dokumentieren.</p></div></div></div></article><article class="rule-chapter"><div class="rule-heading"><span class="rule-num">16</span> Optionale Hausregeln – nicht automatisch aktiv</div><div class="rule-body"><div class="rule-mini-grid"><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Private Hausregeln sind möglich, gelten aber nicht automatisch.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Veranstalter müssen Sonderregeln vor Anmeldung oder Turnierstart bekannt geben.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Für offizielle Ranglisten empfiehlt sich ein einheitliches Regelwerk.</p></div><div class="rule-mini"><span class="rule-mini-mark" aria-hidden="true"></span><p>Optionale Regeln müssen vor dem ersten Spiel verbindlich angekündigt werden.</p></div></div></div></article></div><p class="note">Hinweis: Dieses eigenständig erstellte Regelwerk ist ein ausführlicher Entwurf für BeerpongArena, keine offizielle oder wortgleiche Fassung von BeerPong World. Vor dem ersten realen Turnier müssen Veranstalter alle Varianten und Sonderfälle verbindlich bestätigen.</p>`}
const LG={
nutzungsbedingungen:["Nutzungsbedingungen (Entwurf)",[["1. Geltungsbereich","Diese Nutzungsbedingungen sind ein Entwurf für die geplante BeerpongArena-Plattform. Vor einer echten Registrierung müssen Betreiberangaben, Vertragsschluss und weitere Regelungen rechtlich geprüft und vollständig ergänzt werden."],["2. Öffentliche Spielerprofile","Bei der Nutzung eines Spielerprofils werden der gewählte öffentliche Spielername (auch Pseudonym möglich), Teamzugehörigkeiten, Turnierteilnahmen, Ergebnisse, Ranglistenplätze und Achievements auf der Webseite angezeigt. E-Mail-Adresse, Passwort und sonstige private Kontaktdaten erscheinen nicht öffentlich."],["3. Spielername und Datenschutz","Ein Pseudonym kann statt des Klarnamens gewählt werden. Hinweise zu Verarbeitung, Speicherdauer, Rechtsgrundlagen und Betroffenenrechten stehen in der Datenschutzerklärung. Öffentlich sichtbare Angaben können auch von anderen Personen eingesehen werden."],["4. Änderungen und Kontolöschung","Eine spätere echte Plattform benötigt Funktionen für die Änderung des Anzeigenamens, die Prüfung von Veröffentlichungen sowie die Bearbeitung von Lösch- und Auskunftsanfragen. Diese Demo bietet noch keine echte Kontoverwaltung."],["5. Stand","Entwurf · Oktober 2026 · Vor Veröffentlichung rechtlich prüfen"]]],
veranstalterbedingungen:["Veranstalterbedingungen (Entwurf)",[["1. Plattform und Vertragspartner","BeerpongArena stellt Veranstaltern eine Plattform zur Turnierverwaltung bereit. Vertragspartner für die Veranstaltung ist der jeweils beim Turnier genannte Veranstalter. Die Verantwortlichkeiten und konkrete Vertragsgestaltung müssen vor dem Livegang geprüft werden."],["2. Softwarelizenzen","Geplante Veranstaltertarife: Standard 19,90 € monatlich (bis 24 Teams), Pro 39,90 € monatlich (bis 128 Teams). Vertragslaufzeit, Verlängerung, Kündigung, Leistungsbeschreibung, Steuern und Rechnungsstellung vor dem Produktivstart ergänzen."],["3. Plattformprovision","Planungsmodell B: BeerpongArena erhält 10 % der bezahlten Startgebühr je erfolgreicher Online-Anmeldung. Die Provision wird vom Veranstalteranteil abgezogen. Teilnehmer zahlen keinen zusätzlichen Plattformaufschlag. Zahlungsdienstkosten, Erstattungen, Stornos und Steuerbehandlung sind gesondert vertraglich zu regeln."],["4. Auszahlungen und Stornierungen","Geplant ist eine Anbindung über Stripe Connect mit gesonderten Veranstalterkonten. Der genaue Zahlungsempfänger, Gebühren- und Auszahlungsfluss wird vor Aktivierung technisch und rechtlich festgelegt. Rückerstattungen und Streitfälle werden nachvollziehbar abgerechnet."],["5. Verantwortlichkeiten","Veranstalter sind für Durchführung, Alterskontrolle, Veranstaltungsregeln, Genehmigungen und korrekte Turnierangaben verantwortlich, soweit diese Pflichten rechtlich bei ihnen liegen. Datenschutzrollen und eventuelle gemeinsame Verantwortlichkeiten sind zu prüfen."],["6. Status","Rechtlicher Entwurf. Keine echte Zahlungs- oder Lizenzabwicklung in dieser Demo."]]],
zahlungshinweise:["Zahlungen und Gebühren (Entwurf)",[["1. Preis für Spieler","Die beim Turnier angezeigte Startgebühr ist im geplanten Modell B der zu zahlende Endpreis. BeerpongArena erhebt keinen zusätzlichen Serviceaufschlag gegenüber Spielern."],["2. Verteilung","Von einer erfolgreich bezahlten Startgebühr erhält BeerpongArena nach derzeitiger Planung 10 % Plattformprovision; dem Veranstalter stehen rechnerisch 90 % vor Zahlungsdienstkosten, Steuern und Rückerstattungen zu. Beispiel: 30,00 € Startgebühr = 3,00 € Provision + 27,00 € Veranstalteranteil."],["3. Zahlungsanbieter","Für den späteren Echtbetrieb ist Stripe Connect vorgesehen. Aktuell werden keine echten Zahlungen, Auszahlungen oder Abonnements ausgelöst. Zahlungsdienstleister, Vertragspartner und Datenverarbeitung vor Livegang dokumentieren."],["4. Widerruf und Erstattung","Widerrufsrechte und mögliche Ausnahmen bei termingebundenen Freizeitveranstaltungen sind für jede Vertragskonstellation zu prüfen. Storno- und Erstattungsregeln müssen vor der verbindlichen Buchung angezeigt werden. Eine gegebenenfalls verpflichtende elektronische Widerrufsfunktion ist zu berücksichtigen."],["5. Belege und Steuern","Rechnungsstellung, Umsatzsteuer, Vermittlungsleistung und Aufteilung der Zahlungsgebühren vor Livegang mit Steuerberatung und anwaltlicher Beratung prüfen."]]],
sicherheit:["Sicherheit und Datenschutzkonzept (Planung)",[["Öffentliche und private Daten","Öffentlich vorgesehen: frei gewählter Spielername beziehungsweise Pseudonym, Teamzugehörigkeit, Ergebnisse, Ranglistenplätze und Achievements. E-Mail-Adressen, Zugangsdaten und Zahlungsinformationen sind nicht für öffentliche Profile vorgesehen."],["Geplante Infrastruktur","Geplant sind verwaltete Authentifizierung, Datenbank mit serverseitigen Rollenberechtigungen, gesicherte Bild-Uploads, HTTPS und professionelle Zahlungsabwicklung. Diese Dienste sind in der Demo noch nicht integriert."],["Schutzmaßnahmen vor Livegang","MFA für Verwaltungszugänge, Zugriffstests auf fremde Spieler- und Veranstalterdaten, Rechtekontrollen auf Datenbankebene, Backups und Wiederherstellungstests, Aktualisierungen, Protokollierung, Upload-Prüfung und Sicherheitsüberprüfung."],["Deine Rechte","Vor dem Echtbetrieb werden Verfahren für Auskunft, Korrektur, Löschung, Export und Widerspruch eingerichtet. Veröffentlichung und Aufbewahrung historischer Turnierergebnisse müssen datenschutzrechtlich geprüft werden."],["Wichtiger Hinweis","Dies ist eine öffentliche Beschreibung geplanter Maßnahmen, keine Bescheinigung einer bereits geschützten Live-Infrastruktur. Kein System kann absolute Sicherheit garantieren."]]],
impressum:["Impressum",[["Angaben gemäß § 5 DDG","[Vor- und Nachname bzw. Firma inkl. Rechtsform]<br>[Straße und Hausnummer]<br>[PLZ] Karlsruhe"],["Kontakt","E-Mail: [kontakt@deine-domain.de]<br>Telefon: [Telefonnummer]"],["Vertretung und Register","Vertretungsberechtigt: [Name]<br>Registergericht und Nummer: [falls vorhanden]<br>Umsatzsteuer-ID nach § 27a UStG: [falls vorhanden]"],["Verantwortlich für Inhalte nach § 18 Abs. 2 MStV","[Name und Anschrift wie oben]"],["Verbraucherstreitbeilegung","Wir [sind nicht bereit / sind bereit] , an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teilzunehmen."],["Haftung für Inhalte und Links","Wir sind für eigene Inhalte nach den allgemeinen Gesetzen verantwortlich. Für Inhalte externer Seiten, auf die wir verlinken, sind deren Betreiber verantwortlich. Bei Hinweisen auf Rechtsverletzungen entfernen wir betroffene Inhalte zügig."],["Urheberrecht","Texte, Grafiken und das BeerpongArena-Logo unterliegen dem Urheberrecht. Eine Nutzung außerhalb der gesetzlichen Schranken braucht unsere Zustimmung."]]],
datenschutz:["Datenschutzerklärung",[["1. Verantwortlicher","[Name und Anschrift wie im Impressum], E-Mail: [datenschutz@deine-domain.de]"],["2. Hosting und Server-Logfiles","Beim Aufruf der Seite verarbeitet unser Hosting-Anbieter [Anbieter, Land] technisch notwendige Daten (IP-Adresse, Zeitpunkt, aufgerufene Seite, Browser). Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO (sicherer Betrieb). Die Logfiles werden nach [7] Tagen gelöscht. Mit dem Anbieter besteht ein Auftragsverarbeitungsvertrag."],["3. Schriftarten","Diese Demo verwendet Systemschriftarten, die auf deinem Gerät installiert sind. Es werden dafür keine externen Schriftdateien nachgeladen. [Bei späterer Änderung aktualisieren.]"],["4. Konto und Turnieranmeldung","Aktuell handelt es sich um eine lokale Demo mit fiktiven Profilen und Ergebnissen. Eine echte Registrierung oder zentrale Speicherung von Kontodaten ist noch nicht eingerichtet. [Vor Echtbetrieb Art, Umfang, Speicherdauer und Rechtsgrundlagen der tatsächlichen Verarbeitung beschreiben.]"],["5. Zahlungen","In dieser Demo gibt es keine echte Zahlungsabwicklung. Für den späteren Echtbetrieb ist Stripe Connect geplant. [Vor Livegang eingesetzte Zahlungsdienste, Datenflüsse, Rechtsgrundlagen, Empfänger und Aufbewahrung ergänzen.]"],["6. Öffentliche Ranglisten und Profile","Spielername, Teamname, Ergebnisse, Ranglistenplätze und Achievements sind in der Demo öffentlich einsehbar. Für den Echtbetrieb müssen Rechtsgrundlagen, Pflichtinformationen, die Möglichkeit eines Pseudonyms und Betroffenenrechte rechtlich geklärt werden."],["7. Foto- und Videoaufnahmen","Bei Turnieren können Foto- oder Videoaufnahmen entstehen. Zuständigkeiten, Rechtsgrundlagen, Informationspflichten und mögliche Widerspruchsrechte werden vor dem Livebetrieb für den jeweiligen Veranstaltungsablauf festgelegt."],["8. Cookies und lokale Speicherung","Die vorliegende Demo nutzt keine Analyse- oder Werbe-Cookies und keine echte Login-Sitzung. [Vor Echtbetrieb eingesetzte Speichertechniken überprüfen; Einwilligungspflichten können entstehen.]"],["9. Deine Rechte","Du hast Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Widerspruch (Art. 15–21 DSGVO) sowie auf Widerruf erteilter Einwilligungen. Wende dich an [datenschutz@deine-domain.de]. Beschwerden kannst du an die Aufsichtsbehörde richten, z. B. den Landesbeauftragten für den Datenschutz und die Informationsfreiheit Baden-Württemberg, Stuttgart."],["10. Stand","[Datum eintragen]"]]],
teilnahme:["Teilnahmebedingungen",[["1. Geltung","Diese Bedingungen gelten für Turniere, die über BeerpongArena angeboten werden. Veranstalter ist der jeweils genannte Veranstalter; Die technische Zahlungsabwicklung ist perspektivisch über Stripe Connect vorgesehen. Details werden vor dem Echtbetrieb festgelegt."],["2. Teilnahme","Ein Team besteht aus zwei Personen. Für auf dieser Plattform organisierte Veranstaltungen ist die Teilnahme ab 18 Jahren vorgesehen. Ein tatsächlicher Altersnachweis ist in dieser Demo nicht implementiert. Es gelten die Spielregeln des jeweiligen Turniers."],["3. Anmeldung und Zahlung","Die Anmeldung ist verbindlich. Bei Online-Zahlung ist der Platz nach Zahlungsbestätigung gesichert, bei Zahlung vor Ort wird er bis [Uhrzeit] reserviert. Es gelten die beim Turnier angezeigten Preise inkl. gesetzlicher Umsatzsteuer."],["4. Rücktritt und Erstattung","Bis [x] Tage vor Turnierbeginn ist ein kostenfreier Rücktritt möglich. Danach besteht kein Anspruch auf Erstattung, außer das Team kann einen Ersatz stellen. Fällt das Turnier aus, erstatten wir die Teilnahmegebühr. Ein gesetzliches Widerrufsrecht besteht bei Freizeitveranstaltungen mit festem Termin nicht (§ 312g Abs. 2 Nr. 9 BGB)."],["5. Alkohol und Jugendschutz","Alkohol wird nur an Personen ab 18 Jahren ausgegeben. Es gibt immer eine alkoholfreie Alternative, und niemand wird zum Trinken gedrängt. Wer Alkohol getrunken hat, fährt nicht selbst."],["6. Verhalten und Ausschluss","Wer andere gefährdet, beleidigt oder gegen Anweisungen der Turnierleitung verstößt, kann ohne Erstattung ausgeschlossen werden."],["7. Haftung","Wir haften unbeschränkt bei Vorsatz, grober Fahrlässigkeit und bei Verletzung von Leben, Körper oder Gesundheit. Bei einfacher Fahrlässigkeit haften wir nur für die Verletzung wesentlicher Vertragspflichten und begrenzt auf den typischen Schaden. Für mitgebrachte Gegenstände wird nicht gehaftet."],["8. Schlussbestimmungen","Es gilt deutsches Recht. Ist eine Regelung unwirksam, bleibt der Rest gültig. [Gerichtsstand nur soweit gesetzlich zulässig.]"]]]};
function pFooterInformation(k){
 if(k==="veranstalter-info")return `<section class="legal legal-landing"><div class="kicker">INFORMATIONEN</div><h2>Für Veranstalter<span style="color:var(--lime)">.</span></h2><p class="legal-lead">Alles Wichtige zur Turnierorganisation auf BeerpongArena – an einem Ort.</p><div class="legal-links-grid"><a href="#/veranstalterbedingungen"><strong>Veranstalterbedingungen</strong><span>Softwarelizenzen, Pflichten und Turnierverwaltung</span><i>↗</i></a><a href="#/zahlungshinweise"><strong>Gebühren &amp; Zahlungen</strong><span>10 % Plattformprovision, Preise und Abrechnung</span><i>↗</i></a><a href="#/sicherheit"><strong>Sicherheit &amp; Datenschutz</strong><span>Geplante Schutzmaßnahmen und Verantwortlichkeiten</span><i>↗</i></a></div><p class="mute small" style="margin-top:22px">Diese Informationen sind Entwürfe für die Demo und müssen vor dem Onlinegang rechtlich überprüft werden.</p></section>`;
 if(k==="kontakt")return `<section class="legal legal-landing"><div class="kicker">BEERPONGARENA</div><h2>Kontakt<span style="color:var(--lime)">.</span></h2><p class="legal-lead">Fragen zu Turnieren, Spielerprofilen oder zur Nutzung der Plattform? Hier findest du den richtigen Ansprechpartner.</p><div class="legal-links-grid"><div class="legal-info-card"><strong>Allgemeine Anfragen</strong><p>Fragen zu BeerpongArena, Benutzerkonten oder technischen Problemen.</p><span>Kontakt-E-Mail wird vor dem öffentlichen Start ergänzt.</span></div><div class="legal-info-card"><strong>Turnieranmeldungen</strong><p>Bei Fragen zu einem konkreten Turnier wende dich an die jeweilige Turnierleitung. Die Veranstalterkontaktdaten werden später auf der Turnierseite angezeigt.</p></div><div class="legal-info-card"><strong>Datenschutz &amp; Profilangaben</strong><p>Fragen zur Veröffentlichung von Spielergebnissen oder zum Umgang mit personenbezogenen Daten.</p><a href="#/datenschutz">Datenschutzhinweise ansehen ↗</a></div></div><p class="mute small" style="margin-top:22px">Hinweis: Noch kein aktiver Support oder E-Mail-Postfach hinterlegt. Die vollständigen Betreiber- und Kontaktdaten müssen vor der Veröffentlichung eingetragen werden.</p></section>`;
 return "";
}
function pLegal(k){const [t,s]=LG[k];const mk=h=>h.replace(/\[([^\]]+)\]/g,"<mark>[$1]</mark>");
 return `<div class="legal"><h2>${t}</h2><div class="lnote">Vorlage: Die markierten Platzhalter müssen mit deinen echten Daten ersetzt werden. Lass die Texte vor dem Livegang rechtlich prüfen. Das ist keine Rechtsberatung.</div>${s.map(r=>`<h3>${r[0]}</h3><p>${mk(r[1])}</p>`).join("")}</div>`}
function footerHTML(){return `<div class="fin fin-compact"><a class="logo foot-logo" href="#/">${document.querySelector("header .logo img, header .logo svg")?.outerHTML||""}<span class="bpa-wordmark" aria-label="BeerpongArena"><span class="bpa-wordmark-main">BEERPONG</span><span class="bpa-wordmark-accent">ARENA<span class="bpa-wordmark-dot">.</span></span></span></a><div class="foot-links"><a href="#/impressum">Impressum</a><a href="#/datenschutz">Datenschutz</a><a href="#/nutzungsbedingungen">Nutzungsbedingungen</a><a href="#/teilnahme">Teilnahme</a><a href="#/veranstalter-info">Für Veranstalter</a><a href="#/kontakt">Kontakt</a></div><div class="foot-responsibility"><b>18+</b><span>Verantwortungsvoll genießen.<br>Alkoholfreie Alternativen. Kein Alkohol am Steuer.</span></div><div class="foot-copy">© 2026 BeerpongArena · Demo. Rechtliche Pflichtangaben vor Veröffentlichung vervollständigen.</div></div>`}

let signedIn=false;
try{signedIn=sessionStorage.getItem("beerpongarena-demo-signed-in")==="yes";const stored=Number(sessionStorage.getItem("beerpongarena-demo-player"));if(Number.isInteger(stored)&&stored>=0&&stored<PLAYERS.length)me=stored}catch(e){}
function accountMenuClose(){const d=$("#account-dropdown"),b=$("#who");if(d)d.hidden=true;if(b)b.setAttribute("aria-expanded","false")}
function accountMenuToggle(){const d=$("#account-dropdown"),b=$("#who");if(!signedIn){demoLogin();return}const open=d.hidden;d.hidden=!open;b.setAttribute("aria-expanded",String(open))}
function userHeader(){const b=$("#who"),d=$("#account-dropdown");if(signedIn){const name=PLAYERS[me][0],initials=name.split(" ").map(n=>n[0]).join("");b.innerHTML=`<span class="user-avatar">${initials}</span><span class="user-name">${name}</span><svg class="login-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;b.setAttribute("aria-label","Profilmenü öffnen");d.innerHTML=`<div class="menu-user"><span class="user-avatar">${initials}</span><span><strong>${name}</strong><small>${tn(PLAYERS[me][1])}</small></span></div>${teamsForPlayer(me).length>1?`<div class="member-team-switch"><label class="member-team-label" for="account-team-picker">Mein Team auswählen</label><select class="member-team-select" id="account-team-picker">${teamsForPlayer(me).map(id=>`<option value="${id}" ${selectedTeam(me)===id?"selected":""}>${tn(id)}</option>`).join("")}</select></div>`:""}<button type="button" role="menuitem" id="menu-karriere"><svg class="menu-icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.7-4.4 3.3-6.5 7.5-6.5s6.8 2.1 7.5 6.5"/></svg>Spielerkarriere</button><button type="button" role="menuitem" id="menu-team"><svg class="menu-icon" viewBox="0 0 24 24"><path d="M12 2 21 6v6c0 5-3.5 8.5-9 10-5.5-1.5-9-5-9-10V6z"/><path d="m9 12 2 2 4-4"/></svg>Mein Team</button><button type="button" role="menuitem" id="menu-logout" class="logout"><svg class="menu-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>Abmelden</button>`}else{b.innerHTML=`<svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.7-4.4 3.3-6.5 7.5-6.5s6.8 2.1 7.5 6.5"/></svg><span>Anmelden</span>`;b.setAttribute("aria-label","Demo-Anmeldung öffnen");d.innerHTML="";accountMenuClose()}}
function demoLogin(){const d=$("#dlg");d.innerHTML=`<h3 style="font-size:32px;margin-bottom:8px">Anmelden</h3><p class="login-warning">Demo-Modus: Wähle ein Beispielprofil aus. Es werden keine echten Zugangsdaten geprüft.</p><label class="signin-label" for="demo-user">Spielerprofil</label><select id="demo-user">${PLAYERS.map((p,i)=>`<option value="${i}" ${i===me?"selected":""}>${p[0]} · ${tn(p[1])}</option>`).join("")}</select><div class="row"><button class="btn" id="demo-confirm">Demo-Profil öffnen</button><button class="btn ghost" id="demo-register">Registrieren</button><button class="btn ghost" id="demo-cancel">Abbrechen</button></div>`;d.showModal();$("#demo-cancel").onclick=()=>d.close();$("#demo-register").onclick=()=>demoRegistration();$("#demo-confirm").onclick=()=>{me=Number($("#demo-user").value);signedIn=true;try{sessionStorage.setItem("beerpongarena-demo-signed-in","yes");sessionStorage.setItem("beerpongarena-demo-player",String(me))}catch(e){}d.close();location.hash="#/karriere";route()}}
function demoRegistration(){
 const d=$("#dlg");
 d.innerHTML=`<div class="reg-header"><div class="kicker">BEERPONGARENA ACCOUNT</div><h3>Registrieren<span style="color:var(--lime)">.</span></h3><p class="mute small">Registrierungsvorschau im Demo-Modus. Es wird noch kein echtes Benutzerkonto erstellt.</p></div>
 <label for="reg-demo-name">Öffentlicher Spielername</label><input type="text" id="reg-demo-name" autocomplete="nickname" maxlength="45" placeholder="Dein Name oder Pseudonym" required>
 <p class="reg-hint">Der Spielername ist auf öffentlichen Profilen, in Ranglisten, bei Turnieren und Ergebnissen sichtbar. Verwende bei Bedarf ein Pseudonym.</p>
 <div class="reg-confirm"><label for="reg-terms"><input type="checkbox" id="reg-terms" required><span>Ich akzeptiere die <a href="#/nutzungsbedingungen" data-reg-legal>Nutzungsbedingungen</a> und habe die <a href="#/datenschutz" data-reg-legal>Datenschutzhinweise</a> gelesen.</span></label></div>
 <div class="reg-confirm"><label for="reg-public"><input type="checkbox" id="reg-public" required><span>Ich bestätige, dass mein gewählter <strong>Spielername</strong>, meine <strong>Teamzugehörigkeiten</strong>, <strong>Turnierergebnisse</strong>, <strong>Ranglistenplätze</strong> und <strong>sportlichen Erfolge</strong> öffentlich auf BeerpongArena angezeigt werden. Private Kontakt- und Zugangsdaten werden nicht öffentlich angezeigt.</span></label></div>
 <p class="reg-error" id="reg-error" role="alert" hidden>Bitte gib einen Spielernamen ein und bestätige beide Punkte.</p>
 <div class="row"><button class="btn" id="reg-finish" type="button" disabled>Registrierung bestätigen</button><button class="btn ghost" id="reg-back" type="button">Zurück</button></div>`;
 const finish=$("#reg-finish"), name=$("#reg-demo-name"), terms=$("#reg-terms"),pub=$("#reg-public");
 const validate=()=>{finish.disabled=!(name.value.trim().length>=2&&terms.checked&&pub.checked);};
 [name,terms,pub].forEach(x=>x.addEventListener("input",validate));
 d.querySelectorAll('[data-reg-legal]').forEach(a=>a.addEventListener('click',()=>d.close()));
 $("#reg-back").onclick=()=>demoLogin();
 finish.onclick=()=>{if(finish.disabled){$("#reg-error").hidden=false;return}
   // No real account is created: explicitly remain on the existing demo flow.
   d.close();toast("Demo: Bestätigung erfasst. Ein echtes Konto wird noch nicht angelegt.");
 };
}

const NAV=[[ "#/","Start"],["#/turniere","Turniere"],["#/rangliste","Rangliste"],["#/community","Community"],["#/regeln","Regeln"]];

const EVENT_IMAGE_KEY="beerpongarena-v31-event-images";
function eventImages(){try{return JSON.parse(localStorage.getItem(EVENT_IMAGE_KEY)||"{}")||{}}catch(e){return {}}}
function eventImageHtml(e,extra=""){const src=eventImages()[e.id];return src?`<img class="event-upload-img ${extra}" src="${src}" alt="Turnierbild: ${e.n}" loading="lazy">`:`<div class="event-img-placeholder ${extra}" aria-label="Noch kein Turnierbild"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="2"/><path d="m3 17 5-5 4 4 3-3 6 5"/></svg></div>`}
function pCommunity(){return `<div class="community-head bpa-page-heading"><div class="kicker">Die Arena gehört euch</div><h1>COMMUNITY<span style="color:var(--lime)">.</span></h1><p class="bpa-page-sub">Entdecke Spieler, Teams, Erfolge und Geschichten der BeerpongArena.</p></div><div class="community-switch"><button class="${communityTab==='players'?'on':''}" data-community="players">Spieler entdecken</button><button class="${communityTab==='teams'?'on':''}" data-community="teams">Teams entdecken</button></div><div class="community-search"><input id="communitySearch" type="search" placeholder="Spieler oder Team suchen …" value="${communityQuery.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></div><div class="community-grid">${communityTab==='players'?PLAYERS.map((p,i)=>({p,i})).filter(o=>o.p[0].toLowerCase().includes(communityQuery.toLowerCase())).map(({p,i})=>`<a href="#/spieler/${i}" class="community-tile"><div class="community-avatar">${p[0].split(' ').map(a=>a[0]).join('')}</div><div><strong>${p[0]}</strong><small>${tn(p[1])}</small></div><span>↗</span></a>`).join(''):T.filter(t=>t.name.toLowerCase().includes(communityQuery.toLowerCase())).map(t=>`<a href="#/team/${t.id}" class="community-tile">${logo(t.id,49)}<div><strong>${t.name}</strong><small>${stats()[t.id].w} Siege · ${stats()[t.id].titles} Titel</small></div><span>↗</span></a>`).join('')}</div>`}
function pPlayerPublic(index){const p=PLAYERS[Number(index)];if(!p)return pCommunity();const x=stats()[p[1]],a=achList(p[1]);return `<div class="public-player-page"><a class="mute small" href="#/community">← Alle Spieler</a><div class="community-head"><div class="community-avatar" style="width:86px;height:86px;font-size:30px">${p[0].split(' ').map(v=>v[0]).join('')}</div><h1>${p[0]}</h1><p class="mute">Team ${tn(p[1])} · öffentliches Spielerprofil</p></div><div class="community-grid">${[['Matchsiege',x.w],['Turniertitel',x.titles],['Cupdifferenz',x.diff],['Gesamtpunkte',x.total]].map(k=>`<div class="card"><small class="mute">${k[0]}</small><h2 class="pts">${k[1]}</h2></div>`).join('')}</div><section class="sec"><h2>Team-Achievements</h2><button type="button" class="badge-preview-button" data-badge-preview="1" onclick="return window.BPAOpenUnlockPreview(event)" aria-label="Achievement-Unlock-Animation ansehen">✦ Unlock-Animation testen</button><div class="grid">${a.map(z=>achCard(z,80)).join('')}</div></section></div>`}
let communityTab='players',communityQuery='';

function route(){const h=location.hash||"#/";const [,p,a]=h.split("/");
 $("#nav").innerHTML=NAV.map(n=>`<a href="${n[0]}" class="${(n[0]==="#/"?h==="#/"||h==="#":h.startsWith(n[0])||(n[0]==="#/turniere"&&p==="turnier")||(n[0]==="#/rangliste"&&p==="team"))?"on":""}">${n[1]}</a>`).join("");
 userHeader();
 $("#app").innerHTML=p==="turniere"?pTurniere():p==="turnier"?pEvent(a):p==="rangliste"?pRang():p==="community"?pCommunity():p==="spieler"?pPlayerPublic(a):p==="karriere"?(signedIn?pKarriere():pCommunity()):p==="team"?pTeam(a):p==="regeln"?pRegeln():["kontakt","veranstalter-info"].includes(p)?pFooterInformation(p):LG[p]?pLegal(p):pStart();
 $("#ft").innerHTML=footerHTML();window.scrollTo(0,0)}
function rerender(){const y=scrollY;route();scrollTo(0,y)}
addEventListener("hashchange",()=>{accountMenuClose();route()});
document.addEventListener("click",e=>{if(!e.target.closest(".account-menu-wrap"))accountMenuClose()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")accountMenuClose()});
document.addEventListener("input",e=>{if(e.target.id==="communitySearch"){communityQuery=e.target.value;const pos=e.target.selectionStart;const section=document.querySelector(".community-grid");if(section){const temp=document.createElement("div");temp.innerHTML=pCommunity();section.innerHTML=temp.querySelector(".community-grid")?.innerHTML||""}}});
document.addEventListener("change",e=>{if(e.target.id==="account-team-picker"){
 const id=Number(e.target.value);if(teamsForPlayer(me).includes(id)){
 chosenTeamByPlayer[me]=id;try{sessionStorage.setItem("beerpongarena-selected-team-"+me,String(id))}catch(err){}

// V45: bind reveal animations to existing, real card selectors.
(function(){
 const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 let io;
 if(!reduced && 'IntersectionObserver' in window){
  io=new IntersectionObserver(entries=>entries.forEach(entry=>{
   if(entry.isIntersecting){entry.target.classList.add('motion-visible');io.unobserve(entry.target)}
  }),{threshold:0.12,rootMargin:'0px 0px -15px 0px'});
 }
 function attach(){
  const app=document.getElementById('app');if(!app)return;
  app.querySelectorAll('.arena-update,.arena-spot,.arena-record,.hall-shell .card,.ac').forEach((el,i)=>{
   if(el.dataset.motionBound)return;el.dataset.motionBound='1';
   if(reduced||!io)return;
   // Ensure cards don't disappear when JavaScript runs in previews that can't scroll.
   el.classList.add('motion-enter');
   el.style.transitionDelay=((i%4)*85)+'ms';
   io.observe(el);
  });
 }
 const app=document.getElementById('app');
 if(app){new MutationObserver(attach).observe(app,{childList:true});attach()}
 window.addEventListener('hashchange',()=>requestAnimationFrame(attach));
})();

(function(){
 function closeDemo(){document.querySelector('.badge-demo-wrap')?.remove();}
 function showDemo(){

  document.body.append(wrap);
 }
 document.addEventListener('click',e=>{
  if(e.target.closest('[data-badge-preview]'))showDemo();
  if(e.target.closest('[data-preview-again]'))showDemo();
  if(e.target.closest('[data-preview-close]')||e.target.classList.contains('badge-demo-wrap'))closeDemo();
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDemo()});
})();
